  set: "✅ Language set to English."
  btn_id: "🇮🇩 Bahasa Indonesia"
  btn_en: "🇬🇧 English"

start:
  welcome: |
    Hi! 👋 I turn your text or photos into <b>images</b> and <b>videos</b>, right inside Telegram.

    • Write your idea in Indonesian or English; I'll polish it into a prompt.
    • The credit cost is always shown <b>before</b> you create.
    • Failed? Your credits come back automatically.

