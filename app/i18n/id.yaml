help:
  text: |
    <b>Bantuan</b>

    /menu — menu utama
    /saldo — saldo kredit
    /settings — pengaturan dan bahasa
    /help — bantuan ini

    Cara pakai: pilih jenis karya, tulis ide kamu, cek biaya kredit, lalu buat. Video selalu minta konfirmasi biaya dulu.

