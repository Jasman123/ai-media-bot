start:
  welcome: |
    Halo! 👋 Saya bantu kamu membuat <b>gambar</b> dan <b>video</b> dari teks atau foto, langsung di Telegram.

    • Ketik ide kamu dalam Bahasa Indonesia, saya rapikan jadi prompt.
    • Biaya kredit selalu ditampilkan <b>sebelum</b> kamu membuat.
    • Gagal? Kredit kembali otomatis.

